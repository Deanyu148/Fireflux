name: Release

# 推送到 master 就自动打包并发布 Release（同一版本重复推送 = 更新同一个 Release）
# 也支持推版本标签（v0.1.0）或在 Actions 页面手动触发
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 / 更新 Release 需要

concurrency:
  group: release-${{ github.ref }}
  # 发布/打包不可被后续推送中断；新发布排队等待当前 NSIS/ZIP 完成。
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm 与 Node
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 检查 Svelte 组件
        run: pnpm check:svelte

      - name: 运行渲染调度回归测试
        run: pnpm test:rendering

      # dist 脚本里必须带 --publish never：CI 环境下 electron-builder 会默认「顺手发布」到
      # GitHub 并要求 GH_TOKEN，和下面的 softprops 步骤重复，还会让整个 job 直接失败
      - name: 构建并打 Windows 安装包（NSIS）
        run: pnpm dist

      - name: 读取版本号
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发版版本：v$VERSION"

      - name: 上传 Windows 安装包与便携 ZIP（Actions 页面留档，7 天后过期）
        uses: actions/upload-artifact@v4
        with:
          name: fireflux-${{ steps.pkg.outputs.version }}-windows
          path: release/*
          retention-days: 7

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Fireflux v${{ steps.pkg.outputs.version }}
          files: release/*
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
