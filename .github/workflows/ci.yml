name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, rendering tests, and renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte components
        run: pnpm check:svelte

      - name: Typecheck main and preload
        run: pnpm typecheck

      - name: Run rendering scheduler tests
        run: pnpm test:rendering

      - name: Build Electron renderer and processes
        run: pnpm build
